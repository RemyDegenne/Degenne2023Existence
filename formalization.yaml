# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml for the fields.

version: "v0.4"

project:
  name: "Degenne2023Existence"
  description: >-
    A Lean 4 formalization of "On the Existence of a Complexity in Fixed Budget Bandit
    Identification" (Rémy Degenne, COLT 2023), on top of LMLExplore, and through it LML, Tau Ceti
    and Mathlib. In fixed budget identification, an algorithm family samples K arms for T rounds
    and answers a query about their means; its probability of error p decreases like exp(-T/h).
    The paper compares the rates h of algorithm families to the oracle difficulty of the static
    proportions algorithms through the difficulty ratio, proves generic lower bounds on that ratio
    by a change of measure, shows that it is at most K and equal to K for positivity, at least 1
    for Gaussian tasks with a flat boundary, and that best arm identification has no complexity
    for Gaussian arms with K large and for two Bernoulli arms. The statements use LMLExplore's
    identification tasks, fixed-budget algorithms and exponential families on any task, and new
    library-shaped notions (algorithm families, rates, oracle difficulties, difficulty ratios,
    static proportions, large deviation principles) to be ported to LMLExplore. Phase 1 states the
    headline results with sorry and freezes them as comparator challenges; phase 2 proves them.
  authors:
    - "Remy Degenne"
  responsible_maintainers:
    - "Remy Degenne"
  license: "Apache-2.0"
  repository: "https://github.com/RemyDegenne/Degenne2023Existence"
  blueprint: "https://RemyDegenne.github.io/Degenne2023Existence/blueprint/"

repository:
  role: "substantive-development"

sources:
  - title: "On the Existence of a Complexity in Fixed Budget Bandit Identification"
    authors:
      - "Rémy Degenne"
    id: "COLT 2023, PMLR 195; arXiv:2303.09468v2 (the numbering of the citations)"
    type: "conference-paper"
    location: "All numbered results: Theorems 1-3, 5-8, 10, 12, 13, Corollaries 4, 14, Lemmas 9, 11, 15-20; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The arXiv sources of revision v2 are in source/. The blueprint (blueprint/src/) is a derived
      artifact of this project. The formalizer is the author of the paper. The statements started
      from the statement-only draft of the paper in the LMLPapers project
      (Papers/COLT2023/Degenne2023Existence), rebased on LMLExplore. Errors found in the paper are
      in notes/paper-errata.md.

related_formalizations: []   # the LMLPapers draft has statements only, on another library

classification:
  arxiv: ["stat.ML", "cs.LG"]
  msc2020:
    - "62L05"   # sequential statistical design
    - "68T05"   # learning and adaptive systems
    - "60F10"   # large deviations

status:
  scope: >-
    Phase 1 (2026-11-09): the 24 headline statements below are stated with sorry in
    Degenne2023Existence/D2023/ (namespace Degenne2023Existence, one file per result), over
    the library-shaped definitions of Degenne2023Existence/ForLMLExplore/
    (Identification/FixedBudgetComplexity.lean, Probability/LargeDeviations/Basic.lean) and
    Assumption 1 (D2023/Setting.lean). Lemmas 17 and 18 are blueprint lemmas of the proof of
    Theorem 7 (misprinted, E4). The outline is notes/blueprint-outline.md.
    Phase 2, round of 2026-11-09: the lower bounds of Section 3 and Appendix B (Theorems 2, 3, 13,
    Corollaries 4, 14; blueprint chapter lower) are proved, over the change of measure for
    fixed-budget algorithms (ForLMLExplore/Identification/ErrorLowerBound.lean), the bound
    kl(p, q) >= p log(1/q) - log 2 (ForLMLExplore/InformationTheory/KullbackLeibler/Bernoulli.lean)
    and the maximin bound on the simplex (ForLMLExplore/Analysis/Convex/Simplex.lean).
    Phase 2, second round of 2026-11-09: Gaussian half-space identification and tasks with a flat
    boundary (Lemmas 15, 16, Theorem 7; blueprint chapter range) are proved, over the static
    value of Gaussian half-space identification with per-arm variances
    (ForLMLExplore/Identification/Task/HalfSpace.lean), the per-arm Gaussian transportation cost
    (ForLMLExplore/Identification/Task/ExpFamily.lean) and the infinite ratio of families that
    are not consistent at a model (asymptoticRatio_eq_top). The proof of Theorem 7 does not use
    Lemmas 17 and 18, which remain blueprint statements.
    Phase 2, third round of 2026-11-09: Cramér's theorem on R (blueprint chapter prereq-ldp,
    ForLMLExplore/Probability/LargeDeviations/Cramer.lean) is proved, the upper bound for every law
    with a mean and the lower bound for every law (by truncation and exponential tilting), with
    the goodness of the rate function when the cumulant generating function is finite near 0, and
    its exponential-family form isLDP_cramer_expFamily. The headline Lemma 11 was blocked: as frozen
    it is false for the zero base measure (notes/statement-corrections.md).
    Decision of 2026-11-09 (/lml:formalize-paper decide): Lemma 11 takes the hypothesis NeZero rho,
    which the paper leaves implicit; its challenge is regenerated, and it is proved as
    isLDP_cramer_expFamily.
    Phase 2, fourth round of 2026-11-09: two-armed best arm identification (Lemmas 9, 19, 20;
    blueprint chapter bai) is proved, over the static-proportions difficulty of two arms in any
    exponential family, the inverse of the Chernoff information
    (ForLMLExplore/Identification/Task/BestArmTwo.lean), and the divergence of an exponential
    family in its first argument: the compensation identity with the free mean first, the Chernoff
    point, and the sub-Gaussian comparison
    (ForLMLExplore/Probability/Distributions/ExponentialFamily/Mean.lean and RateFunction.lean).
    The proof of Lemma 19 uses no derivative, unlike the paper's.
    Phase 2, fifth round of 2026-11-09: the large deviation principle of the empirical means under
    static proportions (Theorem 12; blueprint lemmas lem:ldp_pi and lem:ldp_window) is proved, for
    any algorithms whose numbers of pulls stay within a fixed distance k of T w and any laws of the
    arms whose empirical means satisfy a principle with a good rate function, in particular with
    the Cramér rate functions when the cumulant generating functions are finite near 0
    (ForLMLExplore/Bandits/StaticAllocation.lean). The proof works in LML's array model, with the
    converse exponential bounds of a principle, exponential tightness and the goodness of weighted
    sums of rate functions (ForLMLExplore/Probability/LargeDeviations/Basic.lean). Theorem 12 is its
    exponential-family case.
    Phase 2, sixth round of 2026-11-09: the four headline statements of Theorems 1 and 5 were
    blocked: as frozen they take any sigma-algebra on the answers, and for the trivial one the
    probability of error, an outer measure, is 1 for every algorithm (notes/statement-corrections.md,
    Theorems 1 and 5, with a Lean counterexample). With measurable sets of correct answers, the rate
    of static proportions (Theorem 1, tendsto_errorRate_of_isStaticProportions_of_measurableSet) and
    the bound (min_j w_j)^-1 on their maximal difficulty ratio (Theorem 5, both forms, the
    _of_measurableSet lemmas of D2023/Theorem5.lean) are proved, over the probability of error of a
    static proportions family as a probability of the trajectory, the rate from the exponent of the
    probability of error (ForLMLExplore/Identification/FixedBudgetComplexity.lean), and the empirical
    means in the convex supports of the arms (ForLMLExplore/Bandits/StaticAllocation.lean).
    Decision of 2026-11-11 (/lml:formalize-paper decide): the four statements take the hypothesis
    MeasurableSingletonClass on the answers, which the paper leaves implicit (its answers are a
    finite set of indices), and those of Theorem 1 (rate) and Theorem 5 drop the finiteness of the
    answers, which their proofs do not use; their challenges are regenerated. The three are proved
    from the _of_measurableSet lemmas; oracleDifficulty_staticClass remains.
    At the user's request (2026-11-11), Lemma 15 drops the hypothesis MeasurableSingletonClass on
    the arms, which its proof does not use, instead of silencing the linter; its challenge is
    regenerated.
    Phase 2, round of 2026-11-11: the oracle difficulty of the class of static proportions
    algorithms (Theorem 1, displayed consequence, oracleDifficulty_staticClass) is proved, from its
    two halves at the models with a measurable set of correct answers: the lower bound on the
    probability of error of every static proportions family with a rule correct on the admissible
    models, and the rate of the static proportions families of cumulative tracking with a
    measurable recommendation rule built from Assumption 1 (D2023/Theorem1.lean). Over them, in
    ForLMLExplore/Identification/FixedBudgetComplexity.lean: the existence of static proportions
    families for positive proportions and any measurable rule, the supremum over the positive
    proportions, the one-sided bound on the rate from the exponent of the probability of error, the
    antitonicity of the oracle difficulty and of the difficulty ratios, and the static-proportions
    difficulty as the characteristic time for symmetric divergences. The proof does not use the
    condition of Assumption 1 that each answer set is the interior of its closure.
  sorry_count: 3
  sorry_in_definitions: 0

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        The formalize-paper skill of the lml plugin
        (https://github.com/LeanMachineLearning/lml-claude) on lml-paper-template: phase 1 with a
        human (blueprint, headline statements, comparator challenges), then the unattended rounds
        of scripts/formalize.sh; Tau Ceti workers port the library-shaped results to LMLExplore.

review:
  # unchecked until the phase-1 statement check; then self-assessed once the user has checked the
  # statements (author-verified when the user is an author of the paper), agent-reviewed while only
  # an agent has.
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    2026-11-09: the headline statements were checked against the paper by the agent (Claude),
    which found the errata E1-E7. The author of the paper (the formalizer) accepted that check and
    its modelling decisions without reviewing the statements line by line, so the status stays
    agent-reviewed. Comparator checks that the project proves exactly them.

alignment:
  namespace: "Degenne2023Existence"
  note: >-
    The full source-to-Lean map is the blueprint: each environment of blueprint/src/chapters/*.tex
    carries a \lean{} tag. Only the headline statements are repeated here. Each has its Literature
    Links relation, read "paper relation Lean": exactMatch, closeMatch, broadMatch (the Lean
    statement is more general), narrowMatch (the paper's is) or hasPart; and its entry in
    notes/paper-errata.md when the paper had to be corrected. H_{C^sp} of the paper is
    LMLExplore.Identification.IdentTask.staticDifficulty, equal to the oracle difficulty of the
    static proportions algorithms by Theorem 1.
  statements:
    - source: "thm:oracle_difficulty_sp — Theorem 1"
      lean: "Degenne2023Existence.tendsto_errorRate_of_isStaticProportions"
      module: "Degenne2023Existence.D2023.Theorem1"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E1"
      note: "Assumes a recommendation rule that answers i off the closure of the alternatives to i (E1) and samples in the closure of the means (E2). The hypothesis MeasurableSingletonClass on the answers, implicit in the paper (its answers are a finite set of indices), was added on 2026-11-11, and the finiteness of the answers dropped (notes/statement-corrections.md, Theorems 1 and 5)."
    - source: "thm:oracle_difficulty_class — Theorem 1 (displayed consequence)"
      lean: "Degenne2023Existence.oracleDifficulty_staticClass"
      module: "Degenne2023Existence.D2023.Theorem1"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E1"
      note: "Assumes samples in the closure of the means (E2). The class of static proportions algorithms takes every recommendation rule correct on the models (E1); the maximum is over the closed simplex. The hypothesis MeasurableSingletonClass on the answers, implicit in the paper (its answers are a finite set of indices), was added on 2026-11-11 (notes/statement-corrections.md, Theorems 1 and 5)."
    - source: "thm:R_LB — Theorem 2"
      lean: "Degenne2023Existence.inv_difficultyRatio_mul_le"
      module: "Degenne2023Existence.D2023.Theorem2"
      status: "proved"
      relation: "broadMatch"
      note: "Any task; disjoint correct answers instead of mu, lambda in D with different answers; log 2 / sqrt T moved to the right, in [0, ∞]."
    - source: "thm:asm_R_LB_limsup — Theorem 3 (first inequality)"
      lean: "Degenne2023Existence.inv_iSup_asymptoticRatio_le"
      module: "Degenne2023Existence.D2023.Theorem3"
      status: "proved"
      relation: "broadMatch"
      note: "Assumes only that the probability of error at mu tends to 0, not consistency."
    - source: "thm:asm_R_LB_limsup_all — Theorem 3 (second inequality)"
      lean: "Degenne2023Existence.inv_maxRatio_le"
      module: "Degenne2023Existence.D2023.Theorem3"
      status: "proved"
      relation: "exactMatch"
    - source: "cor:corner_lb — Corollary 4"
      lean: "Degenne2023Existence.sum_inv_le_iSup_asymptoticRatio"
      module: "Degenne2023Existence.D2023.Corollary4"
      status: "proved"
      relation: "broadMatch"
      note: "Any set of arms instead of all the arms, as used in the proof of Theorem 8."
    - source: "thm:uniform_upper_bound — Theorem 5"
      lean: "Degenne2023Existence.maxRatio_staticDifficulty_le_of_isStaticProportions"
      module: "Degenne2023Existence.D2023.Theorem5"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E1"
      note: "H_{C^sp} is the static-proportions difficulty, equal to it by Theorem 1. The hypothesis MeasurableSingletonClass on the answers, implicit in the paper (its answers are a finite set of indices), was added on 2026-11-11, and the finiteness of the answers dropped (notes/statement-corrections.md, Theorems 1 and 5)."
    - source: "thm:uniform_upper_bound_uniform — Theorem 5 (uniform allocation)"
      lean: "Degenne2023Existence.maxRatio_staticDifficulty_le_card"
      module: "Degenne2023Existence.D2023.Theorem5"
