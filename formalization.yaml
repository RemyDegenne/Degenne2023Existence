# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml for the fields.

version: "v0.4"

project:
  name: "Degenne2023Existence"
  description: >-
    A Lean 4 formalization of "On the Existence of a Complexity in Fixed Budget Bandit
    Identification" (Rémy Degenne, COLT 2023), on top of LMLExplore, and through it LML, Tau Ceti
    and Mathlib. In fixed budget identification, an algorithm family samples K arms for T rounds
    and answers a query about their means; its probability of error p decreases like exp(-T/h).
    The paper compares the rates h of algorithm families to the oracle difficulty of the static
    proportions algorithms through the difficulty ratio, proves generic lower bounds on that ratio
    by a change of measure, shows that it is at most K and equal to K for positivity, at least 1
    for Gaussian tasks with a flat boundary, and that best arm identification has no complexity
    for Gaussian arms with K large and for two Bernoulli arms. The statements use LMLExplore's
    identification tasks, fixed-budget algorithms and exponential families on any task, and new
    library-shaped notions (algorithm families, rates, oracle difficulties, difficulty ratios,
    static proportions, large deviation principles) to be ported to LMLExplore. Phase 1 states the
    headline results with sorry and freezes them as comparator challenges; phase 2 proves them.
  authors:
    - "Remy Degenne"
  responsible_maintainers:
    - "Remy Degenne"
  license: "Apache-2.0"
  repository: "https://github.com/RemyDegenne/Degenne2023Existence"
  blueprint: "https://RemyDegenne.github.io/Degenne2023Existence/blueprint/"

repository:
  role: "substantive-development"

sources:
  - title: "On the Existence of a Complexity in Fixed Budget Bandit Identification"
    authors:
      - "Rémy Degenne"
    id: "COLT 2023, PMLR 195; arXiv:2303.09468v2 (the numbering of the citations)"
    type: "conference-paper"
    location: "All numbered results: Theorems 1-3, 5-8, 10, 12, 13, Corollaries 4, 14, Lemmas 9, 11, 15-20; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The arXiv sources of revision v2 are in source/. The blueprint (blueprint/src/) is a derived
      artifact of this project. The formalizer is the author of the paper. The statements started
      from the statement-only draft of the paper in the LMLPapers project
      (Papers/COLT2023/Degenne2023Existence), rebased on LMLExplore. Errors found in the paper are
      in notes/paper-errata.md.

related_formalizations: []   # the LMLPapers draft has statements only, on another library

classification:
  arxiv: ["stat.ML", "cs.LG"]
  msc2020:
    - "62L05"   # sequential statistical design
    - "68T05"   # learning and adaptive systems
    - "60F10"   # large deviations

status:
  scope: >-
    Phase 1 (2026-11-09): the 24 headline statements below are stated with sorry in
    Degenne2023Existence/D2023/ (namespace Degenne2023Existence, one file per result), over
    the library-shaped definitions of Degenne2023Existence/ForLMLExplore/
    (Identification/FixedBudgetComplexity.lean, Probability/LargeDeviations/Basic.lean) and
    Assumption 1 (D2023/Setting.lean). Lemmas 17 and 18 are blueprint lemmas of the proof of
    Theorem 7 (misprinted, E4). The outline is notes/blueprint-outline.md.
    Phase 2, round of 2026-11-09: the lower bounds of Section 3 and Appendix B (Theorems 2, 3, 13,
    Corollaries 4, 14; blueprint chapter lower) are proved, over the change of measure for
    fixed-budget algorithms (ForLMLExplore/Identification/ErrorLowerBound.lean), the bound
    kl(p, q) >= p log(1/q) - log 2 (ForLMLExplore/InformationTheory/KullbackLeibler/Bernoulli.lean)
    and the maximin bound on the simplex (ForLMLExplore/Analysis/Convex/Simplex.lean).
    Phase 2, second round of 2026-11-09: Gaussian half-space identification and tasks with a flat
    boundary (Lemmas 15, 16, Theorem 7; blueprint chapter range) are proved, over the static
    value of Gaussian half-space identification with per-arm variances
    (ForLMLExplore/Identification/Task/HalfSpace.lean), the per-arm Gaussian transportation cost
    (ForLMLExplore/Identification/Task/ExpFamily.lean) and the infinite ratio of families that
    are not consistent at a model (asymptoticRatio_eq_top). The proof of Theorem 7 does not use
    Lemmas 17 and 18, which remain blueprint statements.
  sorry_count: 15
  sorry_in_definitions: 0

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        The formalize-paper skill of the lml plugin
        (https://github.com/LeanMachineLearning/lml-claude) on lml-paper-template: phase 1 with a
        human (blueprint, headline statements, comparator challenges), then the unattended rounds
        of scripts/formalize.sh; Tau Ceti workers port the library-shaped results to LMLExplore.

review:
  # unchecked until the phase-1 statement check; then self-assessed once the user has checked the
  # statements (author-verified when the user is an author of the paper), agent-reviewed while only
  # an agent has.
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    2026-11-09: the headline statements were checked against the paper by the agent (Claude),
    which found the errata E1-E7. The author of the paper (the formalizer) accepted that check and
    its modelling decisions without reviewing the statements line by line, so the status stays
    agent-reviewed. Comparator checks that the project proves exactly them.

alignment:
  namespace: "Degenne2023Existence"
  note: >-
    The full source-to-Lean map is the blueprint: each environment of blueprint/src/chapters/*.tex
    carries a \lean{} tag. Only the headline statements are repeated here. Each has its Literature
    Links relation, read "paper relation Lean": exactMatch, closeMatch, broadMatch (the Lean
    statement is more general), narrowMatch (the paper's is) or hasPart; and its entry in
    notes/paper-errata.md when the paper had to be corrected. H_{C^sp} of the paper is
    LMLExplore.Identification.IdentTask.staticDifficulty, equal to the oracle difficulty of the
    static proportions algorithms by Theorem 1.
  statements:
    - source: "thm:oracle_difficulty_sp — Theorem 1"
      lean: "Degenne2023Existence.tendsto_errorRate_of_isStaticProportions"
      module: "Degenne2023Existence.D2023.Theorem1"
      status: "stated"
      relation: "narrowMatch"
      erratum: "E1"
      note: "Assumes a recommendation rule that answers i off the closure of the alternatives to i (E1) and samples in the closure of the means (E2)."
    - source: "thm:oracle_difficulty_class — Theorem 1 (displayed consequence)"
      lean: "Degenne2023Existence.oracleDifficulty_staticClass"
      module: "Degenne2023Existence.D2023.Theorem1"
      status: "stated"
      relation: "narrowMatch"
      erratum: "E1"
      note: "Assumes samples in the closure of the means (E2). The class of static proportions algorithms takes every recommendation rule correct on the models (E1); the maximum is over the closed simplex."
    - source: "thm:R_LB — Theorem 2"
      lean: "Degenne2023Existence.inv_difficultyRatio_mul_le"
      module: "Degenne2023Existence.D2023.Theorem2"
      status: "proved"
      relation: "broadMatch"
      note: "Any task; disjoint correct answers instead of mu, lambda in D with different answers; log 2 / sqrt T moved to the right, in [0, ∞]."
    - source: "thm:asm_R_LB_limsup — Theorem 3 (first inequality)"
      lean: "Degenne2023Existence.inv_iSup_asymptoticRatio_le"
      module: "Degenne2023Existence.D2023.Theorem3"
      status: "proved"
      relation: "broadMatch"
      note: "Assumes only that the probability of error at mu tends to 0, not consistency."
    - source: "thm:asm_R_LB_limsup_all — Theorem 3 (second inequality)"
      lean: "Degenne2023Existence.inv_maxRatio_le"
      module: "Degenne2023Existence.D2023.Theorem3"
      status: "proved"
      relation: "exactMatch"
    - source: "cor:corner_lb — Corollary 4"
      lean: "Degenne2023Existence.sum_inv_le_iSup_asymptoticRatio"
      module: "Degenne2023Existence.D2023.Corollary4"
      status: "proved"
      relation: "broadMatch"
      note: "Any set of arms instead of all the arms, as used in the proof of Theorem 8."
    - source: "thm:uniform_upper_bound — Theorem 5"
      lean: "Degenne2023Existence.maxRatio_staticDifficulty_le_of_isStaticProportions"
      module: "Degenne2023Existence.D2023.Theorem5"
      status: "stated"
      relation: "narrowMatch"
      erratum: "E1"
      note: "H_{C^sp} is the static-proportions difficulty, equal to it by Theorem 1."
    - source: "thm:uniform_upper_bound_uniform — Theorem 5 (uniform allocation)"
      lean: "Degenne2023Existence.maxRatio_staticDifficulty_le_card"
      module: "Degenne2023Existence.D2023.Theorem5"
      status: "stated"
      relation: "narrowMatch"
      erratum: "E1"
    - source: "thm:positivity_LB — Theorem 6"
      lean: "Degenne2023Existence.iInf_maxRatio_minThresholdTask_eq_card"
      module: "Degenne2023Existence.D2023.Theorem6"
      status: "stated"
      relation: "exactMatch"
      note: "Positivity is LMLExplore's minimum threshold task; the threshold is a mean of every family. The proof follows the correction E3."
    - source: "thm:flat_boundary — Theorem 7"
      lean: "Degenne2023Existence.one_le_iInf_maxRatio_of_hyperplane"
      module: "Degenne2023Existence.D2023.Theorem7"
      status: "proved"
      relation: "broadMatch"
      note: "Does not assume Assumption 1; sup-norm ball (an equivalent hypothesis). The proof follows the correction E5, by a shorter route than the paper's, without Lemmas 17 and 18 (E4)."
    - source: "thm:gaussian_bai_no_complexity — Theorem 8"
      lean: "Degenne2023Existence.ofReal_mul_log_le_iInf_maxRatio_baiTask_gaussian"
      module: "Degenne2023Existence.D2023.Theorem8"
      status: "stated"
      relation: "exactMatch"
