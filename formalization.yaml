      note: "The hypothesis MeasurableSingletonClass on the answers, implicit in the paper (its answers are a finite set of indices), was added on 2026-11-11, and the finiteness of the answers dropped (notes/statement-corrections.md, Theorems 1 and 5)."
    - source: "thm:positivity_LB — Theorem 6"
