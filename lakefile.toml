# A paper project on top of LMLExplore. LMLExplore brings Mathlib, Tau Ceti and LML at the versions
# it pins: never require them here, or at other revisions (`scripts/check-pins.sh` checks).
name = "Degenne2023Existence"
defaultTargets = ["Degenne2023Existence"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# LMLExplore's settings, which ForLMLExplore/ must meet. The two long-file options must agree, or
# the linter asks for a `set_option` in every short file.
weak.linter.style.header = true
weak.linter.style.longFile = 1500
weak.linter.style.longFileDefValue = 1500

[[require]]
name = "LMLExplore"
git = "https://github.com/LeanMachineLearning/LMLExplore"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "Degenne2023Existence"

# Comparator (https://github.com/leanprover/comparator) challenge and solution modules for the
# headline results listed in formalization.yaml; see comparator/README.md. One library with a stub
# root: tools that import every library root (checkdecls) must not load the challenge modules,
# which redeclare project and LMLExplore names, so those are globs, not roots. Add one
# "Challenge_<name>" entry per line of comparator/targets.txt.
[[lean_lib]]
name = "Comparator"
srcDir = "comparator"
leanOptions = { weak.linter.mathlibStandardSet = false, weak.linter.style.header = false }
globs = [
  "Comparator",
  "Solution",
  "Challenge_tendsto_errorRate_of_isStaticProportions",
  "Challenge_oracleDifficulty_staticClass",
  "Challenge_inv_difficultyRatio_mul_le",
  "Challenge_inv_iSup_asymptoticRatio_le",
  "Challenge_inv_maxRatio_le",
  "Challenge_sum_inv_le_iSup_asymptoticRatio",
  "Challenge_maxRatio_staticDifficulty_le_of_isStaticProportions",
  "Challenge_maxRatio_staticDifficulty_le_card",
  "Challenge_iInf_maxRatio_minThresholdTask_eq_card",
  "Challenge_one_le_iInf_maxRatio_of_hyperplane",
  "Challenge_ofReal_mul_log_le_iInf_maxRatio_baiTask_gaussian",
  "Challenge_inv_staticDifficulty_baiTask_bernoulli_two",
  "Challenge_one_lt_iInf_maxRatio_baiTask_bernoulli_two",
  "Challenge_isLDP_empiricalMean_expFamily",
  "Challenge_isLDP_empMean_of_isStaticProportions",
  "Challenge_inv_liminf_iSup_difficultyRatio_le",
  "Challenge_inv_liminf_iSup_difficultyRatio_le_liminf",
  "Challenge_inv_staticDifficulty_halfSpaceTask_gaussian",
  "Challenge_one_le_iInf_maxRatio_halfSpaceTask_gaussian",
  "Challenge_inv_staticDifficulty_baiTask_expFamily_two",
  "Challenge_iInf_cost_baiTask_expFamily_two",
  "Challenge_isMaxOn_iInf_cost_baiTask_expFamily_two",
  "Challenge_ofReal_div_le_inv_staticDifficulty_baiTask_two",
  "Challenge_inv_staticDifficulty_baiTask_gaussian_two",
]
